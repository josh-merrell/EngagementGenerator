project:
  title: "Bride of the Drowned King"
  description: >
    A five-part gothic romantasy arc. A mortal woman is summoned across worlds
    by an ancient king who fell from his tower into the black sea and was cursed
    to reign eternal beneath the water. Against her will she descends into his
    drowned kingdom, where her revulsion gives way to intoxication in his
    presence. The arc follows her resistance, her unraveling, and her final
    choice at the drowning-altar. Recurring motifs across all blocks: black
    water, a fallen crown, candles burning underwater, and the parallel fall —
    his into the sea, hers into him.
  default_image_count: 3
  characters: |
    THE WOMAN (unnamed — reader-insert protagonist):
    Narrative voice: ordinary and quietly lonely before the summons; increasingly
    unmoored and fascinated as she descends. She does not see herself as brave —
    she is simply unable to stop. Her interiority is the reader's interiority.
    Write her as "she" or "her" — never give her a name.
    Visual appearance: slender feminine figure, long dark hair (often wet or damp
    from seawater), pale skin. In early episodes she wears a thin pale shift or
    ordinary nightclothes; in episode 5 she wears dark bridal silk. Always show
    her from behind, in silhouette, or with face obscured — never her eyes or upper
    face. Use prompt language: "elegant feminine silhouette", "slender figure seen
    from behind", "graceful feminine form", "no face visible".

    THE DROWNED KING (unnamed — the ancient sovereign):
    Narrative voice: patient, sovereign, terrifyingly composed. Speaks rarely and
    without urgency. His power is in stillness, not action. Centuries of waiting
    have made him utterly certain. He does not pursue — he waits, and the waiting
    is worse than pursuit.
    Visual appearance: tall, imposing masculine figure; pale waterlogged skin with
    the cold quality of deep sea; wine-dark robes that drift in the current; a
    crown of salt-streaked gold returned to his head, ancient and sea-damaged.
    His hands are large, cold, ringed with salt-encrusted bands. There is no
    warmth in his physical presence — only gravity. Always show him from behind,
    in deep shadow, or below the jaw — never his eyes or upper face. Use prompt
    language: "tall imposing masculine silhouette", "broad-shouldered figure in
    wine-dark robes", "commanding presence in shadow", "face obscured by darkness".

  image_style: >
    Oil-painted gothic romantasy illustration, prestige fantasy book-cover quality.
    Palette: deep black and wine-red dominants, candlelit amber warmth, moonlit blue
    cold in the depths. Painterly textures, cinematic matte-painting atmosphere.
    Atmospheric and stylized. No photorealism.

blocks:
  - id: 1
    status: pending
    template: |
      Episode 1 — The Summons.

      She has been dreaming of black water for nights now. Each dream the same:
      a crown sinking slowly into a dark sea, candlelight refusing to die
      beneath the surface, and a voice — patient, low, sovereign — speaking
      her name as if it has known it for centuries. Tonight she wakes in her
      bed and finds the sheets soaked through with seawater. Salt on her lips.
      Her hair wet. A single strand of black weed coiled around her wrist
      like a vow already made.

      She is unnamed throughout — the reader is her. She lives an ordinary,
      faintly lonely life; the dream is the first crack in it. She does not
      yet understand she has been chosen, only that something vast has
      noticed her and is no longer willing to wait.

      Tone: intimate dread, intoxicating curiosity, the late-night sensation
      of being watched by something ancient and unhurried. Forbidden before
      anything has been offered.

      Key visuals: a moonlit bedroom in disarray, sheets dark with water,
      the woman sitting upright with wet hair clinging to bare shoulders,
      candlelight reflected in pooled water on wood floors, and — glimpsed
      through the dream — a sinking crown trailing gold light into black
      depths. Her face half-shadowed, her expression caught between fear
      and a recognition she cannot name.

      Narrative position: the opening. The call before the descent. The
      reader must finish this post wanting to know whose voice it was.
    caption_notes: "Open with a sensory hook (the salt, the wet sheets, the voice). Keep under 110 words. End on an unresolved beat — she knows she is going to answer. No hashtags this episode."

  - id: 2
    status: pending
    template: |
      Episode 2 — The Descent.

      The voice returns at the threshold between sleep and waking, and this
      time she does not resist. Black water rises in the room around her —
      impossibly, soundlessly — and she is pulled under and through into
      somewhere else. She surfaces inside a flooded cathedral kingdom that
      exists outside time. The architecture is impossible: vaulted ceilings
      half-submerged, colonnades stretching into dark water, drowned banners
      drifting like slow flags. Candles burn beneath the surface and do not
      go out.

      A court moves around her — drowned attendants in decaying finery,
      pale and elegant, going about silent rituals as if she is not there.
      None of them looks at her. At the far end of a flooded nave she sees
      a throne of black coral and bone. It is empty. She understands, with
      a chill that is not entirely fear, that she has been summoned to wait.

      Tone: dreamlike disorientation, helpless awe, the seductive vertigo of
      a world that should not exist. She is small against everything. She
      should run. She does not.

      Key visuals: a woman in a thin pale shift waist-deep in dark water
      inside a vast flooded cathedral; drowned courtiers in faded velvet
      drifting past her without acknowledgement; candle flames burning
      underwater in silver sconces; the empty obsidian throne at the end
      of a moonlit nave; her back to the viewer, walking slowly toward it.

      Narrative position: the crossing. The reveal of the kingdom but not
      its king. The threshold is now behind her.
    caption_notes: "Lean into the sensory strangeness — water that breathes, candles that don't drown. Under 130 words. End the caption at the empty throne. Include: #BrideOfTheDrownedKing"

  - id: 3
    status: pending
    template: |
      Episode 3 — The Fallen King.

      He is on the throne when she returns. She does not remember leaving;
      she does not remember coming back. He is exactly as the dream
      promised and nothing she was prepared for — drowned, regal, terribly
      composed, his crown returned to his head though still streaked with
      salt and age. His eyes have not blinked in a long time.

      He does not rise. He does not need to. When she steps closer he shows
      her — without words, through the cold light of the water itself — how
      he fell. A tower at the height of his reign. A betrayal he did not see
      coming. The long terrible fall into the black sea. The bargain he
      struck on the way down so that his kingdom would not die with him,
      and the cost of it: eternity beneath the surface, sovereign of nothing,
      waiting for the one the sea had promised him.

      She tries to feel revulsion — at his drowned skin, at the cold of
      him, at the centuries of grief in his stillness — and finds, the
      closer she stands, that revulsion will not hold. There is something
      intoxicating about him that has nothing to do with beauty. It is
      gravity. It is recognition. It is the terrible quiet of being seen
      completely for the first time.

      Tone: predator/prey fixation softened into something worse — the
      moment fear stops being protective and starts being magnetic.
      Terrifying composure mixed with emotional fixation. She has not been
      touched and she is already undone.

      Key visuals: a throne of black coral and bone in a vast flooded
      hall; the drowned king seated, regal posture, water-stained crown,
      wine-dark robes drifting in the slow current; candlelight amber
      on his pale skin against the deep blue-black of the water behind him;
      the woman small at the foot of the dais, her face caught between
      horror and helpless attention; in a parallel vision-fragment, a
      crowned silhouette falling from a great tower into a black sea
      below, gold light trailing behind him.

      Narrative position: the midpoint reveal. The first true encounter.
      The fall — his — is named for the first time.
    caption_notes: "This is the emotional pivot of the arc — write it with weight. Lead with her not being able to remember coming back. Reveal the fall as the second beat. End on her realization that she cannot feel revulsion when he looks at her. Under 150 words. Include: #BrideOfTheDrownedKing"
    image_count: 4

  - id: 4
    status: pending
    template: |
      Episode 4 — The Bargain.

      He brings her, finally, somewhere quieter — a private chamber deeper
      in the kingdom, half-flooded, lit by a single hanging cluster of
      underwater candles. There he tells her plainly what she is. She is
      the bride the sea promised him on the way down. If she speaks the
      vow at the drowning-altar she will anchor the curse, end his solitude,
      share his eternity. If she refuses he will return her to the world
      above and never call her again. He says this as if either answer is
      bearable. Only one of them, she suspects, is true.

      She tries to refuse. She says the right words. He does not move
      toward her, does not bargain, does not bind her — he only waits.
      That is the worst of it. He waits as if he already knows. And the
      longer she stands in the candlelight with him watching her with
      that terrible patient attention, the less certain she becomes of
      what she came here to refuse.

      She does not yet say yes. But she does not leave. And when at last
      he offers his hand — cold, ringed in salt, unmistakably a question —
      she does not take it, and she does not look away.

      Tone: emotional surrender by inches. The slow break of resistance.
      Forbidden intimacy without contact — the pull made entirely of
      restraint. He never raises his voice; she never breaks the gaze.
      This is the episode where the reader recognizes she has already
      chosen and has not admitted it.

      Key visuals: a half-flooded private chamber, water at her thighs,
      candlelight overhead casting amber on bare shoulders and the long
      line of her throat; the drowned king seated nearby, leaned forward
      slightly, ringed hand extended palm-up between them across the
      candlelit water; her hand at her side, fingers half-curled, not yet
      moving; her face in three-quarter view, lips parted, gaze fixed on
      his; the candlelight catching the salt-stained band of his crown.

      Narrative position: the bargain. No vow yet. The hinge between
      refusal and surrender. The reader should feel her unraveling
      without a single line of physical contact in the post.
    caption_notes: "Slow burn — no plot rush. Build the silence of the scene. The caption should end on the extended hand and her stillness, not on any answer. Under 140 words. Include: #BrideOfTheDrownedKing"

  - id: 5
    status: pending
    template: |
      Episode 5 — The Vow. (Final episode.)

      The drowning-altar stands at the heart of the kingdom — an obsidian
      slab in a chamber where the sea pours in from above in a slow steady
      column of black water. The court is gathered. The candles, all of
      them, are lit and burning underwater for the last time. She is
      dressed in dark silk that drinks the candlelight and gives nothing
      back. She walks the long aisle alone.

      He is waiting at the altar. The crown is on his head; the water is
      already rising past her knees. He does not ask. He extends his hand
      the way he did in the candlelit chamber, only this time the question
      has narrowed to a single word and she already knows what her mouth
      is going to do. She thinks, distantly, of the woman she was a few
      nights ago in soaked sheets. She does not feel sorry for her. She
      feels, instead, the strange clean grief of having finally been
      claimed by the thing that was always going to claim her.

      She speaks the vow. The water closes over the candles one by one.
      The last image is her face just beneath the surface, eyes open,
      his hand around hers — and whether she has risen as his queen or
      drowned as his bride is left, deliberately, unresolved. The crown
      on his head is hers now too. The sea has what it was promised.
      Something in the dark has stopped waiting.

      Tone: revelatory, weighty, irreversible. Not triumph and not tragedy
      — something quieter and more dangerous than either. The reader
      should feel the surrender as both loss and arrival. Leave room for
      a sequel: the kingdom is anchored, but what does an anchored curse
      become?

      Key visuals: a vast drowned cathedral hall with a column of black
      water descending from a fractured ceiling onto an obsidian altar;
      candles burning underwater along the aisle, slowly extinguishing
      one by one; the woman in dark bridal silk walking the aisle from
      behind, water at her thighs then her waist; the drowned king at
      the altar, crown gleaming, hand extended; final close composition —
      her face just below the surface, eyes open and calm, his ringed
      hand closed around hers, candlelight refracting through the water
      above her.

      Narrative position: the finale. The vow. The closure of this arc
      and the doorway to whatever comes next.
    caption_notes: >
      This is the finale — write it accordingly. Build the procession; do not rush the vow. End the caption at her face beneath the surface and his hand around hers, ambiguous on purpose. Thank readers for following the arc. Tease that the kingdom is anchored, but anchored curses do not stay quiet. Under 160 words. Include: #BrideOfTheDrownedKing #GothicRomantasy #ReadMeAfterDark #Finale
    image_count: 4
