      Episode 9 — The Retreat. (Final episode.)

      The book launches in nine days becomes the book has launched seven
      days ago. The Hollow Throne, book seven, is the bestselling fiction
      release of the year within forty-eight hours. The cover is
      everywhere — black silk and gold leaf, her old typo across the
      bottom in lowercase italic. She has not opened it. He has gone.

      A car comes for her on the eighth day. The driver does not say
      where. The drive is long, then longer, then there are no other
      cars. She arrives at dusk at a lake house she has never seen — low
      and dark against a stand of pine, a long wooden porch, a single
      window lit warm against the failing light. He is at that window in
      his dark coat, his back to her, writing.

      She climbs the porch steps. He does not turn when she enters. He
      walks back into the house and trusts that she will follow him,
      because he has already written that she does. She follows him.

      He has set up her side of the desk. A second chair, drawn close
      to his. A green-shaded lamp matching his own. A clean stack of
      heavy paper. The heavy black fountain pen — his pen, the one that
      signed her book, that lay on her nightstand for nine nights —
      placed at the top of the stack as if it had always been hers.
      Beside it, his notebook is open to a fresh page. The page is not
      empty. The top of it has been filled in already, in his hand, in
      black ink, the way every chapter of every book in this series has
      ever begun:

      *Hannah Cole walked through the door.*

      Tone: irreversible quiet, dangerous arrival, the strange clean
      grief of having finally been claimed by the thing that was
      always going to claim her. Not triumph, not tragedy — surrender
      as homecoming. Peace in being known. The reader should feel her
      relief as the most disturbing thing in the chapter.

      She does not say anything. She does not pretend she has not
      chosen. She sits in the chair beside his and picks up the pen.
      Whether she becomes the heroine of his next book or merely the
      first reader of it is left, deliberately, unresolved. The
      Hollow Throne is finished. Something else is starting.

      Key visuals: a remote lake house at dusk, low dark cabin against
      tall pines, a single warm window in the failing blue light;
      Hannah from behind in her charcoal cashmere coat at the threshold
      of the porch, long dark hair loose, no face visible; an interior
      study with two desks pushed together, two green-shaded lamps,
      stacks of heavy paper, the leather notebook open on his desk to a
      single inked line of text; the broad-shouldered silhouette of
      Vale at the far desk, back to the viewer, head bent over a page,
      face entirely obscured; final close composition — a feminine hand
      lifting the heavy black fountain pen from a clean stack of paper,
      a silver ring just visible on the masculine hand at the edge of
      the frame, lamp light warm across both.

      Narrative position: the finale. The retreat. The arc closed by
      her choosing to be written again. Sequel space deliberately open
      — the kingdom has not stopped being interested in her.
