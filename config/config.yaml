# EngagementBot — Runtime Configuration
# Apply changes by running: python3 scripts/import-config.py

llm:
  model: gpt-5.5             # OpenAI model to use for caption + image prompt generation
  max_tokens: 3500          # Max response length (entire JSON: caption + image_prompts). NOT a per-caption target — see caption_notes for that.

images:
  model: gemini-3.1-flash-image-preview  # Gemini image generation model
                            # Paid alternative: imagen-3.0-generate-002
  count: 3                 # Default number of carousel images per post
  aspect_ratio: "4:5"       # Image aspect ratio; 4:5 is portrait (recommended for Facebook feed)
                            # Note: aspect ratio is passed as a prompt hint with Gemini models
  style: null               # Default image style/mood applied to all blocks; null = no default
                            # Example: "painterly, dark fantasy, cinematic lighting"
